name: Deploy CID Studios to IIS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Sync Files to IIS Web Root and Build Assets
        shell: powershell
        run: |
          $destination = "C:\inetpub\wwwroot\cid_studios"

          if (-not (Test-Path $destination)) {
              New-Item -ItemType Directory -Path $destination -Force
          }

          # Sync code files to IIS folder (Excluding tracking folders and local dev dependencies)
          robocopy . $destination /E /XD .git node_modules /XF .gitignore /NJH /NJS /NDL /nc /ns /np
          if ($LASTEXITCODE -ge 8) { throw "Robocopy copy failed with exit code $LASTEXITCODE" }

          Set-Location $destination

          # ----------------------------------------------------
          # AUTOMATED FRONTEND BUILD PIPELINE
          # ----------------------------------------------------
          # Check for npm and dynamically compile frontend assets in the target directory
          if (Get-Command npm -ErrorAction SilentlyContinue) {
              Write-Host "Running npm installation and production compilation..."
              npm install --no-audit --no-fund
              npm run build
          } else {
              Write-Warning "npm was not found on the server environment variable path. Skipping automatic compilation."
          }

          # ----------------------------------------------------
          # AUTOMATED BACKEND LARAVEL PIPELINE
          # ----------------------------------------------------
          # Locate PHP executable on server dynamically
          $phpCmd = Get-Command php -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
          if (-not $phpCmd) {
              $phpCmd = (Get-ChildItem -Path "C:\" -Filter "php.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          }

          if (-not $phpCmd) {
              throw "PHP executable could not be found on the Windows Server."
          }

          Write-Host "Using PHP executable at: $phpCmd"

          # Run Laravel optimization commands if artisan file is present
          if (Test-Path "artisan") {
              & $phpCmd artisan config:cache
              & $phpCmd artisan route:cache
              & $phpCmd artisan view:cache
          }

          # ----------------------------------------------------
          # AUTOMATED IIS SERVER RESET
          # ----------------------------------------------------
          # Restart IIS AppPools to reflect recent changes safely
          try {
              Import-Module WebAdministration -ErrorAction Stop
              Get-ChildItem IIS:\AppPools | ForEach-Object { Restart-WebAppPool -Name $_.name -ErrorAction SilentlyContinue }
              Write-Host "All IIS AppPools successfully recycled."
          } catch {
              Write-Host "IIS WebAdministration module not loaded. Falling back to clean global system check."
              iisreset /timeout:0
          }
