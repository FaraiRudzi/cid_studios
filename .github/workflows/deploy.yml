name: Deploy CID Studios to IIS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Sync Files to IIS Web Root
        shell: powershell
        run: |
          $destination = "C:\inetpub\wwwroot\cid_studios"

          # Create target directory if missing
          if (-not (Test-Path $destination)) {
              New-Item -ItemType Directory -Path $destination -Force
          }

          # Use Robocopy for reliable file sync without locking errors
          robocopy . $destination /E /XD .git /XF .gitignore /NJH /NJS /NDL /nc /ns /np
          if ($LASTEXITCODE -ge 8) {
              throw "Robocopy copy failed with exit code $LASTEXITCODE"
          }

          Set-Location $destination

          # Optional Laravel cache refresh
          if (Test-Path "artisan") {
              php artisan config:cache
              php artisan route:cache
              php artisan view:cache
          }

          # Attempt IIS AppPool restart safely
          try {
              Import-Module WebAdministration -ErrorAction Stop
              Get-ChildItem IIS:\AppPools | ForEach-Object { Restart-WebAppPool -Name $_.name -ErrorAction SilentlyContinue }
          } catch {
              Write-Host "Skipping IIS AppPool restart: WebAdministration module not present."
          }