name: Deploy CID Studios to IIS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # STEP 1: Set up Node.js and build frontend assets
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-node: '20' # Or your preferred stable LTS version

      - name: Install Frontend Dependencies & Build Assets
        run: |
          npm install
          npm run build

      # STEP 2: Deploy and configure the Laravel application
      - name: Sync Files to IIS Web Root
        shell: powershell
        run: |
          $destination = "C:\inetpub\wwwroot\cid_studios"

          if (-not (Test-Path $destination)) {
              New-Item -ItemType Directory -Path $destination -Force
          }

          # Sync code files (including compiled public/build folder) to IIS folder
          # Robocopy exit codes 0-3 mean successful copies/no changes. 8+ means failure.
          robocopy . $destination /E /XD .git node_modules /XF .gitignore /NJH /NJS /NDL /nc /ns /np
          if ($LASTEXITCODE -ge 8) { throw "Robocopy copy failed with exit code $LASTEXITCODE" }

          Set-Location $destination

          # Locate PHP executable on server dynamically
          $phpCmd = Get-Command php -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
          if (-not $phpCmd) {
              $phpCmd = (Get-ChildItem -Path "C:\" -Filter "php.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          }

          if (-not $phpCmd) {
              throw "PHP executable could not be found on the Windows Server."
          }

          Write-Host "Using PHP executable at: $phpCmd"

          # Run optimal Laravel & Filament v5 caching commands if artisan is present
          if (Test-Path "artisan") {
              & $phpCmd artisan optimize
              & $phpCmd artisan event:cache
          }

          # Restart IIS AppPool cleanly
          try {
              Import-Module WebAdministration -ErrorAction Stop
              # Replace 'DefaultAppPool' with your specific IIS AppPool name if customized
              Restart-WebAppPool -Name "DefaultAppPool" 
              Write-Host "IIS AppPool restarted successfully."
          } catch {
              Write-Host "IIS WebAdministration module not loaded or AppPool restart failed. Falling back to global IIS cycle."
              iisreset /timeout:0
          }
